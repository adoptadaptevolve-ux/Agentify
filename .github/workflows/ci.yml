name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests capabilities examples
      - run: python -m mypy
      - run: python -m pytest -q
      # The golden path must stay runnable with no API key and no network.
      - run: python examples/run_sparring_partner.py
      # The eval dataset must stay valid, and a change that makes the offline
      # judge worse at the platform's own questions must be noticed. Model
      # quality itself is measured by the scheduled eval workflow.
      - run: python -m causeway.cli eval evals/cases --judge sandbox --baseline evals/baselines/sandbox.json
